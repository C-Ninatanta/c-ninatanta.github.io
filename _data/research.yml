  - id: soft-growing
    number: '03'
    label: Orchard automation
    title: Soft-growing manipulator for orchard operations
    summary: Contributed to the design, modeling, and experimental work on a rapidly extending soft robotic 
      manipulator for tree-fruit applications.
    detail: A low-cost soft-growing robotic arm for agricultural work, studied as a flexible alternative to 
      traditional rigid manipulators in orchard environments.
    contributions:
      - Contributed to a soft-growing manipulator for orchard applications
      - Supported design, modeling, and experimental evaluation of the mechanism
    highlight: Up to 1.2 m extension
    secondary: Maximum extension speed of 0.27 m/s; payload up to 1.4 kg
    image: /images/research/soft-growing-manipulator.jpg
    image_alt: Orchard soft-growing manipulator concept with mobile platform, from the IROS 2023 paper
    venue: IROS 2023
    paper: 
      /files/Design%2C%20Modeling%2C%20and%20Control%20of%20a%20Low-Cost%20and%20Rapid%20Response%20Soft-Growing%20Manipulator%20for%20Orchard%20Operations.pdf
    paper_label: Read publication
    tags:
      - Agricultural robotics
      - Manipulator design
      - Robot modeling
    challenge: Robotic orchard systems need useful reach and payload capacity, but conventional rigid arms can
      be costly or cumbersome for time-sensitive tree-fruit operations.
    approach:
      - The team developed a soft-growing fabric manipulator with pressurized extension and a motorized 
        steering mechanism.
      - Linear extension and steering were decoupled to simplify the arm motion and position-control strategy.
      - A kinematic relationship between steering motor positions and the arm pose was developed and 
        experimentally evaluated.
    validation:
      - Extension capability, maximum speed, and terminal payload were characterized on the prototype.
      - Motion-capture measurements supported model verification and comparisons of predicted versus measured 
        end-effector positions.
      - Control experiments examined position tracking with and without the model-based feedforward terms.
    results:
      - value: 1.2 m
        label: Maximum linear extension
        detail: Prototype arm reach
      - value: 0.27 m/s
        label: Maximum extension speed
        detail: Reported in IROS 2023 paper
      - value: 1.4 kg
        label: Reported payload capacity
        detail: Experimental platform capability
    impact: A lightweight growing-arm architecture offers an alternative design direction for agricultural 
      manipulation where cost, reach, and controllability matter.
    source_note: System-level performance figures are reported for the team’s prototype in the IROS 2023 
      publication.
    related_work: Design, Modeling, and Control of a Low-Cost and Rapid Response Soft-Growing Manipulator for 
      Orchard Operations
