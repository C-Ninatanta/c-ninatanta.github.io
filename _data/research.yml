  - id: continuum-modeling
    number: '04'
    label: Modeling and control
    title: Modeling of continuous-curvature soft manipulators
    summary: Contributed to experimental verification of a continuous-curvature model and inverse kinematics 
      for a soft-growing manipulator.
    detail: The published Robotics and Automation Letters study investigates the modeling and experimental 
      verification of a soft-growing robot, including validation of an inverse-kinematic approach.
    contributions:
      - Contributed to experimental verification of a continuous-curvature model
      - Supported evaluation of inverse-kinematics accuracy across target positions
    highlight: 5.01% average normalized model error
    secondary: Inverse-kinematics errors of 2.91%, 7.91%, and 2.14% in three reported trials
    image: /images/research/continuum-manipulator.jpg
    image_alt: Labeled soft-growing manipulator prototype, from the IEEE Robotics and Automation Letters paper
    venue: IEEE RA-L 2024
    paper: /files/Modeling_and_Control_of_a_Continuous_Curvature_based_Soft_Growing_Manipulator.pdf
    paper_label: Read publication
    tags:
      - Robot kinematics
      - Soft robotics
      - Model validation
    challenge: A soft-growing robot bends continuously rather than moving through rigid joints. Accurate 
      modeling is needed to predict its shape and position under steering inputs.
    approach:
      - The team evaluated a continuous-curvature analytical model using a custom soft-growing manipulator.
      - Model predictions were compared with experimentally measured tip trajectories at several robot 
        lengths.
      - An inverse-kinematics method mapped target positions to arm length and steering-cable commands for 
        experimental verification.
    validation:
      - Forward-model accuracy was assessed at nominal arm lengths of 0.5 m, 0.8 m, 1.0 m, and 1.2 m.
      - Inverse kinematics was tested at three target positions, comparing actual and requested tip location.
      - The published results focus on static planar verification, not a completed 3D closed-loop controller.
    results:
      - value: 5.01%
        label: Average normalized model error
        detail: Across four tested arm lengths
      - value: 2.91–7.91%
        label: IK position-error range
        detail: Three target-position trials
      - value: 4 lengths
        label: Model verification conditions
        detail: 0.5, 0.8, 1.0 and 1.2 m
    impact: Experimentally supported kinematics can help make compliant manipulators more predictable and lays
      groundwork for model-based position control.
    source_note: Results and experiment scope come from the 2024 IEEE Robotics and Automation Letters paper. 
      These are reported team outcomes, not independent performance claims.
    related_work: Modeling and Experimental Verification of a Continuous Curvature-based Soft Growing 
      Manipulator
    work_stage: Published · 2024
    media_note: Images are adapted from the linked coauthored research paper; publication figures are credited
      to the original author team.
    role_note: This was collaborative, coauthored research. Please verify the personal role wording before 
      publication.
