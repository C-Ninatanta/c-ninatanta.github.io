  - id: apple-gripper
    number: '01'
    label: Soft robotic manipulation
    title: Lightweight soft electrical apple-harvesting gripper
    summary: Designed and experimentally evaluated a lightweight electrically actuated gripper intended for 
      robotic apple harvesting.
    detail: A soft, electrically actuated end effector developed to handle apples in orchard environments. The
      published study reports physical prototyping and experimental evaluation, including harvesting trials.
    contributions:
      - Developed the soft gripper concept and physical prototype
      - Carried out harvesting experiments and evaluated success and hardware mass
    highlight: 87.5% harvesting success
    secondary: 0.306 kg gripper mass
    image: /images/research/apple-gripper.jpg
    image_alt: Soft electrical gripper grasping an apple in the orchard, from the RoboSoft 2024 paper
    venue: RoboSoft 2024
    paper: /files/Design_of_a_Lightweight_Soft_Electrical_Apple_Harvesting_Gripper.pdf
    paper_label: Read publication
    tags:
      - Soft robotics
      - Mechanical design
      - Experimental validation
    challenge: An apple-harvesting end effector must grip and detach fruit reliably without bruising it. The 
      research also imposed a strict mass constraint so that the gripper could eventually be carried by a 
      lightweight soft-growing manipulator.
    approach:
      - Three cable-driven fingers combined a compliant silicone surface with an embedded, 3D-printed TPU 
        skeleton.
      - Alternative TPU reinforcement patterns were compared to balance finger force, bending range, and a 
        gentle contact surface.
      - An electrically driven pulley closed the fingers; a palm-mounted limit switch enabled 
        contact-triggered actuation. The cable attachment was designed for field serviceability.
    validation:
      - Bench tests measured individual finger force output and bending angle across different TPU 
        reinforcement patterns.
      - Harvesting trials were conducted in a commercial orchard in Prosser, Washington during the 2023 
        growing season.
      - The published study reports picking success and fruit condition under those field-test conditions.
    results:
      - value: 87.5%
        label: Successful picks
        detail: Published orchard evaluation
      - value: 0.306 kg
        label: Prototype gripper mass
        detail: Reported assembled hardware mass
    impact: This work investigates how compliant, low-mass end effectors can help orchard robots manipulate 
      delicate produce without relying on a conventional heavy gripper.
    source_note: Numbers refer to the experimental prototype and conditions reported in the RoboSoft 2024 
      paper; they are not guarantees for other orchards or fruit varieties.
    related_work: Design and Evaluation of a Lightweight Soft Electrical Apple Harvesting Gripper
    work_stage: Published · 2024
    media_note: Images are adapted from the linked coauthored research paper; publication figures are credited
      to the original author team.
    role_note: The individual-contribution summary reflects an earlier portfolio draft and should be confirmed
      before publication.
